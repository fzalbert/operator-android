syntax = "proto3";

import "google/protobuf/wrappers.proto";
import "google/protobuf/empty.proto";

option csharp_namespace = "Profikrol.API.Grpc";
option java_multiple_files = true;
option java_package = "ru.profikrol.operator.data.remote.grpc";
option java_outer_classname = "NotificationProto";

service NotificationService {
  rpc NotificationStream(NotificationClientMessage) returns (stream NotificationServerMessage);
}

message NotificationClientMessage {
  string token = 1;
}

message NotificationServerMessage {
  string message = 1;
  string NotificationType = 2;
  string NotificationCategory = 3;
}
